services:
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      # Self-signed origin cert for the edge's re-encrypted TLS leg (see
      # Caddyfile). Kept out of git; generate on the server before first up:
      #   openssl req -x509 -newkey rsa:2048 -nodes -days 3650 \
      #     -subj "/CN=fidaa.h2-intern.de" \
      #     -addext "subjectAltName=DNS:fidaa.h2-intern.de,DNS:fidaa.h2.de,IP:172.18.184.41" \
      #     -keyout certs/fidaa-key.pem -out certs/fidaa-cert.pem
      - ./certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - frontend
    depends_on:
      - app
      - admin
    restart: unless-stopped

  # FIDAA knowledge server (MCP) — the git submodule `fidaa/`. Serves the
  # knowledge base as MCP tools (search_context, search_bibliography,
  # optionally search_documents) on the internal network; the in-memory
  # index is rebuilt at every boot (no PG). Only the app talks to it — no
  # host ports, no Caddy route.
  fidaa:
    build: ./fidaa
    volumes:
      # Content + server code come from the working tree (like app/admin),
      # so knowledge updates need only pull + restart — no image rebuild.
      # The image's baked copy stays as a standalone fallback; the venv is
      # baked at /opt/venv (outside /app) and is unaffected by this mount.
      - ./fidaa:/app:ro
    env_file:
      - path: secrets.env
        required: false
    environment:
      PYTHONUNBUFFERED: "1"
      # Host allowlist for the MCP transport-security guard: the compose
      # service name (the app connects as Host "fidaa:8002") plus local
      # probes for the healthcheck below.
      MCP_ALLOWED_HOSTS: "fidaa,localhost,127.0.0.1"
      # LLM_URL, LLM_KEY, EMBEDDING_MODEL, USE_EMBED_INSTRUCTIONS,
      # DEFAULT_TASK_INSTRUCTION come from secrets.env (shared with the
      # app service).
      # Optional: bearer-token gate for /mcp. The demo app does NOT
      # forward tokens — leave empty in v1 (see fidaa/secrets.env.example).
      # MCP_TOKEN: ""
      # Optional: folder of .md files for a third search_documents tool
      # (mount a volume first, e.g. ./documents:/app/documents:ro).
      # DOCUMENTS_PATH: /app/documents
    healthcheck:
      # /healthz returns 200 only once the in-memory index is built
      # (503 with an error message while degraded).
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/healthz', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 12
      # Re-embedding at startup takes ~10-60 s depending on the LLM API.
      start_period: 90s
    networks:
      - frontend
    restart: unless-stopped

  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - path: secrets.env
        required: false
    environment:
      PYTHONUNBUFFERED: "1"
      DEFAULT_MODEL: "${DEFAULT_MODEL:-Qwen-3.8}"
      ASSISTANT_NAME: "${ASSISTANT_NAME:-FIDAA}"
      # DATABASE_URL defaults to the local postgres service.
      # If POSTGRES_PASSWORD is changed in secrets.env, update DATABASE_URL too.
      # Set DATABASE_URL directly to use an external database.
      DATABASE_URL: "${DATABASE_URL:-postgresql://appuser:change-me@postgres:5432/chat}"
      # LLM_URL, LLM_KEY, EMBEDDING_MODEL come from secrets.env.
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      MAX_PASSWORD_LENGTH: "${MAX_PASSWORD_LENGTH:-128}"
      MAX_MESSAGE_LENGTH: "${MAX_MESSAGE_LENGTH:-4000}"
      # CHAINLIT_AUTH_SECRET is auto-generated at runtime if unset.
      # Set it in secrets.env to persist sessions across container restarts.
    networks:
      - frontend
    depends_on:
      postgres:
        condition: service_healthy
      # fidaa is healthy only once its in-memory knowledge index is built,
      # so the app always boots against a working knowledge base.
      fidaa:
        condition: service_healthy
    restart: unless-stopped

  # Admin-Panel (eigenes FastAPI-App admin.py, kein LLM), von Caddy
  # unter /admin geroutet – keine Host-Ports. ADMIN_USERS und
  # ADMIN_SESSION_SECRET kommen aus secrets.env (leer = Panel deaktiviert).
  admin:
    build: .
    command: uvicorn admin:app --host 0.0.0.0 --port 8001
    volumes:
      - .:/app
    env_file:
      - path: secrets.env
        required: false
    environment:
      PYTHONUNBUFFERED: "1"
      # Wie bei app: Default ist der lokale postgres-Service.
      # LLM-Variables werden nicht gebraucht.
      DATABASE_URL: "${DATABASE_URL:-postgresql://appuser:change-me@postgres:5432/chat}"
    networks:
      - frontend
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg17
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    env_file:
      - path: secrets.env
        required: false
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-appuser}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-change-me}"
      POSTGRES_DB: "${POSTGRES_DB:-chat}"
    networks:
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-appuser} -d ${POSTGRES_DB:-chat}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  frontend:
    driver: bridge

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
