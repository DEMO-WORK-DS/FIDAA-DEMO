[project]
name = "fidaa-demo"
version = "0.1.0"
description = "Chainlit agent app for FIDAA (MCP-based RAG via the fidaa knowledge server)"
readme = "README.md"
license = "EUPL-1.2-only"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    # 2.12.0: CVE-2026-45018/-45019 fixes + native MCP surface (features.mcp
    # config, McpSession, on_mcp_connect). The legacy pre-2.12 MCP config
    # keys are rejected loudly by this version, so .chainlit/config.toml
    # uses the 2.12-standard [[features.mcp.servers]] block.
    "chainlit==2.12.0",
    # Direct dependency: app.py opens the MCP connection itself (D1.5).
    # Matches chainlit 2.12's own pin (mcp>=1.28.1,<2) — the 1.x line.
    "mcp>=1.28.1,<2",
    "bcrypt",
    # Chainlit 2.12 only ships asyncpg under its `custom-data` extra, but
    # get_data_layer() imports it unconditionally and the data layer is
    # active here (DATABASE_URL is set -> ChainlitDataLayer on postgres;
    # init.sql creates its tables, the transcript export queries them).
    # Pin to chainlit's own custom-data constraint.
    "asyncpg>=0.30.0,<1.0.0",
    "openai",
    # Plain httpx — the [socks] extra belonged to the VPN sidecar variant
    # (archived on branch legacy-vpn-sidecar); do not reintroduce it.
    "httpx",
    "email-validator",
    "peewee",
    "psycopg2-binary",
]

[tool.uv]
managed = true
package = false

# uv.lock is checked into git. It pins all transitive deps and hashes,
# ensuring identical docker builds across machines (uv sync --locked).
# Regenerate with `uv lock` whenever packages should be updated.

[dependency-groups]
dev = [
    "types-peewee>=4.0.5.20260518",
]
